[package]
name = "cdj-media"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/johlrogge/cdj-media"
description = "Read and write Pioneer CDJ/rekordbox USB exports (export.pdb, ANLZ) without rekordbox"

[dependencies]
thiserror = "2"

[dev-dependencies]
proptest = "1"

# Run the example's unit tests with `cargo test`.
[[example]]
name = "rewrite_pdb"
test = true
